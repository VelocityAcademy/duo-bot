name: iPhone Duo stock check

on:
  schedule:
    # Every 5 min, 17:00-22:55 UTC = 4am-10am Melbourne during daylight saving (5am-11am from April).
    # GitHub often runs scheduled jobs a few minutes late.
    - cron: '*/5 17-22 * * *'
    # Check-in ping every 6 hours: 01/07/13/19 UTC = noon, 6pm, midnight, 6am Melbourne (daylight saving).
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch: # lets you hit "Run workflow" to test it
    inputs:
      check_in:
        description: 'Send a check-in ping with the current Duo status'
        type: boolean
        default: false
      test_alert:
        description: 'Send a test phone alert (uses an in-stock iPhone 17, does not touch saved state)'
        type: boolean
        default: false

concurrency:
  group: duo-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Remember which stores already had stock so you're pinged once, not every 5 minutes.
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: duo-state-${{ github.run_id }}
          restore-keys: duo-state-

      - name: Test phone alert
        if: ${{ inputs.test_alert }}
        shell: powershell
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: .\duo-stock-bot.ps1 -Once -Quiet -Label cloud-TEST -Part MG6M4X/A -ProbeParts MG6L4X/A -NtfyTopic $env:NTFY_TOPIC

      - name: Check Apple pickup stock
        if: ${{ !inputs.test_alert }}
        shell: powershell
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEARTBEAT: ${{ github.event.schedule == '0 1,7,13,19 * * *' || inputs.check_in }}
        run: .\duo-stock-bot.ps1 -Once -Quiet -Label cloud -StateFile state.json -NtfyTopic $env:NTFY_TOPIC -Heartbeat:($env:HEARTBEAT -eq 'true')

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: duo-state-${{ github.run_id }}
